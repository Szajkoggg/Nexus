# IWS: the befores of IWS1 and the afters of IWS2 (ideas-overview, ideas-entry), IWS3 (waiting-list as
# waiting-paused, settings-defaults) and IWS4B (idea-links, waiting-list as waiting-link-proposals, ideas-entry as
# ideas-entry-proposal). The mockups are docs/ux/mockups/28-idea-work-signals.html.
seed: scripts/capture/seed-idea-work-signals.ts
