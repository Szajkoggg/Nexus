# IC1/IC4: the same baseline notes and zero pending suggestions.
seed: scripts/capture/seed-ideas-corrections.ts
views:
  - key: ideas-entry-open@1440
    route: "#/demo"
    script: scripts/capture/reset-ideas.js
    actions: &entry
      - click: Ideas
      - click: Overview
      - click: Chat improvements
  - key: ideas-entry-open@492
    route: "#/demo"
    script: scripts/capture/reset-ideas.js
    actions: *entry
  - key: ideas-entry-open@390
    route: "#/demo"
    script: scripts/capture/reset-ideas.js
    actions: *entry
  - key: ideas-matching-empty@1440
    route: "#/demo"
    script: scripts/capture/reset-ideas.js
    actions: &empty
      - click: Ideas
      - click: Overview
  - key: ideas-matching-empty@492
    route: "#/demo"
    script: scripts/capture/reset-ideas.js
    actions: *empty
  - key: ideas-matching-empty@390
    route: "#/demo"
    script: scripts/capture/reset-ideas.js
    actions: *empty
