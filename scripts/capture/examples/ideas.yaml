# The ideas overview in the Ideas panel (queue IO), on the demo project of scripts/capture/seed-ideas.ts: the overview
# on a desktop and on the phone, and an opened note (Queue plan view) in the rail's place with two areas folded, as in
# the mockup (docs/ux/mockups/22-ideas-overview.html). The mockups are the comparison, so no befores:
#   node scripts/capture.ts scripts/capture/examples/ideas.yaml --step IO/IO3 --no-before
seed: scripts/capture/seed-ideas.ts
views:
  - key: ideas-overview@1440
    route: "#/demo"
    label: "Az ötletek áttekintése asztalon: területek, alcsoportok, bejegyzések státusszal, szűrő"
    actions:
      - click: "Ideas"
      - wait: 300
      - click: "Overview"
      - wait: 800
  - key: ideas-overview@390
    route: "#/demo"
    label: "Az ötletek áttekintése telefonon"
    actions:
      - click: "Ideas"
      - wait: 300
      - click: "Overview"
      - wait: 800
  - key: ideas-entry@1440
    route: "#/demo"
    label: "Megnyitott jegyzet a sáv helyén: bejegyzések, státusz-előzmény, nyitott kérdés, queue-k"
    actions:
      - click: "Ideas"
      - wait: 300
      - click: "Overview"
      - wait: 800
      - click: { selector: "button[aria-label='Fold or unfold lifecycle']" }
      - click: { selector: "button[aria-label='Fold or unfold protocol']" }
      - click: "Queue plan view"
      - wait: 800
