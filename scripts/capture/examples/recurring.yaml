# Templates and recurring queues on the Queues view (queue TQ4), on the projects of scripts/capture/seed-recurring.ts:
# "New queue from template" open with a template chosen and filled in, the recurring queues of a project, and one that
# waits for the user's approval. All new views (role result).
#   node scripts/capture.ts scripts/capture/examples/recurring.yaml --step <queue>/<step> --no-before
seed: scripts/capture/seed-recurring.ts
views:
  - key: new-from-template@1440
    route: "#/demo"
    label: "Új queue sablonból: kiválasztott és kitöltött sablon"
    actions:
      - click: All queues of Demo app
      - wait: 800
      - click: New queue from template
      - wait: 800
      - click: { selector: "button[role='radio']" }
      - wait: 400
      - type: { text: "The step list crashes when a queue has no steps", into: "input[name='param-issue']" }
      - type: { text: "the dashboard", into: "input[name='param-area']" }
      - wait: 300
  - key: new-from-template@390
    route: "#/demo"
    label: "Új queue sablonból telefonon"
    actions:
      - click: Queues
      - wait: 800
      - click: New queue from template
      - wait: 800
      - click: { selector: "button[role='radio']" }
      - wait: 400
      - type: { text: "The step list crashes when a queue has no steps", into: "input[name='param-issue']" }
      - wait: 300
  - key: recurring-list@1440
    route: "#/demo"
    label: "Az Ismétlődő rész: jóváhagyott, N queue utáni és szüneteltetett"
    actions:
      - click: All queues of Demo app
      - wait: 1000
  - key: recurring-list@390
    route: "#/demo"
    label: "Az Ismétlődő rész telefonon"
    actions:
      - click: Queues
      - wait: 1000
  - key: recurring-needs-approval@1440
    route: "#/fresh"
    label: "Jóváhagyásra váró ismétlődők (új, és megváltozott), a várakozó elemekkel"
    actions:
      - click: All queues of Fresh app
      - wait: 1000
