# Lifecycle test coverage: after a change to the project's run control or lifecycle code, how well the tests cover
# interrupting, continuing, restarting and the failures. It only reports, in every mode.
template:
  id: lifecycle
  title: Lifecycle test coverage
  description: After a change to the run control or lifecycle code, report how well the tests cover interrupting, continuing, restarting and error handling; it never changes a test itself.
maintenance: survey
params:
  - name: change
    description: "the change to look at: commits (a range such as abc123..def456) or a queue whose commits they are"
  - name: lifecycle_code
    description: "the project's run control or lifecycle code (what starts, stops, resumes and restarts the work)"
    default: the code the project's AGENTS.md names as its run control or lifecycle code
  - name: tests
    description: "where the tests of that code are, and what they run against (for example fakes of the external processes)"
    default: the project's tests
title: "Maintenance: lifecycle test coverage"
description: |
  A survey of how well {{tests}} cover the paths of {{lifecycle_code}} that {{change}} touched: interrupting,
  continuing, restarting and the failures. It reports the paths left uncovered with the tests that would cover them;
  writing them becomes a queue the user approves. Nothing is changed, in any mode (also in fix_small).
  The report ends with a section "Recommended additions" (see the step).
coding: false
origin: maintenance
stop_conditions:
  - Looking would need a change to a test or to the project (a fix, a commit); report it as a finding instead.
  - A decision that belongs to the user comes up; ask with nexus ask, with a recommendation.
  - A file to commit has changes this queue did not make; ask with nexus ask, never commit them.
steps:
  - id: "{{id}}1"
    title: "Survey: the change's lifecycle paths and their tests"
    goal: |
      Read {{change}} (git log and git diff of its commits) and find what it changed in {{lifecycle_code}}. For each
      changed behaviour, list its paths in four groups:
      - Interrupting: a stop, a cancel, a kill or a pause in the middle of the work; what is left and what is told.
      - Continuing: going on after a pause, an answer, a stop that was lifted, a retry; that nothing is done twice or
        lost.
      - Restarting: the process or the server ending and starting again mid-work (a crash, an update); what is
        rebuilt from the saved state, and that it ends as it would have without the restart.
      - Failures: an error of an external process or service, a timeout, a refusal, bad or missing saved state; how
        it is reported and what happens next.
      For each path: the tests in {{tests}} that cover it (file and test name, and what they assert about it), or
      that none do; how likely and how costly a fault there would be. For each uncovered path propose a test: what it
      sets up, what it interrupts or breaks and when, and what it asserts. Read the tests; run them only to see what
      they do, change none. Or say every path is covered. Commit nothing.
      The report ends with "Recommended additions" (not counted among the findings): what would make such tests
      easier to write (a fake of an external process that can be told to fail, a clock the tests move, a helper that
      restarts mid-work), each with its reason.
    acceptance:
      - Each changed behaviour's paths in the four groups, each with its covering tests or marked uncovered with a proposed test, or that every path is covered.
      - The report ends with "Recommended additions", each with its reason (or says there are none).
      - The working tree as it was (no commit, no leftover files).
    review:
      level: 2
    kind: research
    activities: [test]
    size: S
