# Maintenance, the general skeleton: survey the project and report what needs care. In survey mode (the default) it
# changes nothing; in fix_small mode it also fixes the small findings named below.
template:
  id: maintenance
  title: Maintenance
  description: Survey the project for what needs care and report the findings, so that a queue can be proposed from them.
maintenance: survey
params:
  - name: scope
    description: what to survey
    default: dependencies (outdated, vulnerable), failing or slow checks, lint findings, dead code, stale documentation
  - name: small_fixes
    description: the small findings a fix_small run fixes itself
    default: patch-level dependency updates whose checks pass, typos in documentation
title: "Maintenance: {{scope}}"
description: |
  A survey: {{scope}}. It reports the findings, which become a queue the user approves. In survey mode nothing is
  changed or committed; in fix_small mode only these are fixed: {{small_fixes}}.
coding: true
origin: maintenance
stop_conditions:
  - Surveying would need a change to the project (an install, a fix, a commit); report it as a finding instead.
  - A decision that belongs to the user comes up; ask with nexus ask, with a recommendation.
  - A file to commit has changes this queue did not make; ask with nexus ask, never commit them.
steps:
  - id: "{{id}}1"
    title: "Survey: {{scope}}"
    goal: |
      Survey the project: {{scope}}. Write down each finding: what it is, where, how much it matters, and the fix it
      needs (small or not); or that there were none. Change nothing, commit nothing.
    acceptance:
      - Each finding with its weight, or that there were none.
      - The working tree as it was (no commit, no leftover files).
    review:
      level: 2
    kind: research
    activities: [cleanup]
    size: S
  - id: "{{id}}2"
    maintenance: fix_small
    title: "Fix the small findings: {{small_fixes}}"
    goal: |
      Fix only the findings of {{id}}1 that are among these: {{small_fixes}}. Each fix in its own commit, with the
      checks passing; everything else stays a finding for the report.
    acceptance:
      - Each small fix committed with the checks passing; the others listed as findings.
    review:
      level: 2
    kind: code
    activities: [dependency, cleanup]
    size: S
